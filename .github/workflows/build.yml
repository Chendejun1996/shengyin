name: 编译所有平台客户端

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    name: 🐧 Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
        working-directory: client
      - run: flutter build linux --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-linux
          path: client/build/linux/x64/release/bundle/
          retention-days: 7

  windows:
    name: 🪟 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: flutter create --platforms=windows --project-name shengyin .
        working-directory: client
      - run: flutter pub get
        working-directory: client
      - run: flutter build windows --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-windows
          path: client/build/windows/x64/runner/Release/
          retention-days: 7

  macos:
    name: 🍎 macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: flutter create --platforms=macos --project-name shengyin .
        working-directory: client
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
        working-directory: client
      - run: flutter build macos --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-macos
          path: client/build/macos/Build/Products/Release/
          retention-days: 7

  android:
    name: 📱 Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: flutter pub get
        working-directory: client
      - run: flutter build apk --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-android
          path: client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  ios:
    name: 📱 iOS
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    continue-on-error: true  # iOS 需要 Apple 开发者签名，失败不影响其他平台
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: flutter create --platforms=ios --project-name shengyin .
        working-directory: client
      - run: flutter pub get
        working-directory: client
      - run: flutter build ios --release --no-codesign
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-ios
          path: client/build/ios/iphoneos/
          retention-days: 7

  # ─── 发布到 Releases 页面 ─────────────────────────────
  publish:
    name: 📦 发布到 Release
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4

      - name: 准备文件
        run: |
          mkdir -p release
          # Linux
          cd shengyin-linux && tar czf ../release/shengyin-linux-x64.tar.gz . && cd ..
          # Windows
          cd shengyin-windows && zip -r ../release/shengyin-windows-x64.zip . && cd ..
          # macOS
          cd shengyin-macos && zip -r ../release/shengyin-macos.zip . && cd ..
          # Android
          cp shengyin-android/app-release.apk release/shengyin-android.apk

      - name: 🔖 打标签发布
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"

          if [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" == v* ]]; then
            TAG="$REF_NAME"
            TITLE="🎵 笙音 $TAG"
            python3 scripts/extract_changelog.py "$TAG" > /tmp/release-notes.md
          else
            TAG="nightly"
            TITLE="🔄 Nightly 构建 $(date '+%Y-%m-%d %H:%M')"
            echo -n "" > /tmp/release-notes.md
          fi

          ls -la release/

          echo "=== 创建 Release ==="
          
          # 先尝试 gh release create，如果失败就回退到 API
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TITLE" \
            --notes-file /tmp/release-notes.md \
            release/*.{tar.gz,zip,apk} 2>&1 || {
            
            echo "gh 失败，改用 API 创建..."
            NOTES_BODY=$(cat /tmp/release-notes.md | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))" 2>/dev/null || echo '""')
            
            # 先删除旧的 release (如果存在)
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$REPO/releases/tags/$TAG" 2>/dev/null
            
            # 创建 release
            RESULT=$(curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases" \
              -d "{
                \"tag_name\": \"$TAG\",
                \"name\": \"$TITLE\",
                \"body\": $NOTES_BODY,
                \"draft\": false,
                \"prerelease\": false
              }")
            
            echo "API 结果: $RESULT"
            
            # 获取 release ID 并上传文件
            RELEASE_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id', ''))" 2>/dev/null)
            if [ -n "$RELEASE_ID" ]; then
              for f in release/*.tar.gz release/*.zip release/*.apk; do
                [ -f "$f" ] || continue
                echo "上传: $f"
                curl -s -X POST \
                  -H "Authorization: token $GITHUB_TOKEN" \
                  -H "Content-Type: application/octet-stream" \
                  "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$(basename $f)" \
                  --data-binary "@$f" > /dev/null
              done
            fi
          }
