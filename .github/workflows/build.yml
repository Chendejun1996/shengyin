name: 编译所有平台客户端

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    name: 🐧 Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
        working-directory: client
      - run: flutter build linux --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-linux
          path: client/build/linux/x64/release/bundle/
          retention-days: 7

  windows:
    name: 🪟 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: flutter create --platforms=windows --project-name shengyin .
        working-directory: client
      - run: flutter pub get
        working-directory: client
      - run: flutter build windows --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-windows
          path: client/build/windows/x64/runner/Release/
          retention-days: 7

  macos:
    name: 🍎 macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: flutter create --platforms=macos --project-name shengyin .
        working-directory: client
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
        working-directory: client
      - run: flutter build macos --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-macos
          path: client/build/macos/Build/Products/Release/
          retention-days: 7

  android:
    name: 📱 Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: flutter create --platforms=android --project-name shengyin .
        working-directory: client
      - run: flutter pub get
        working-directory: client
      - run: flutter build apk --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-android
          path: client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  ios:
    name: 📱 iOS
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: flutter create --platforms=ios --project-name shengyin .
        working-directory: client
      - run: flutter pub get
        working-directory: client
      - run: flutter build ios --release --no-codesign
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-ios
          path: client/build/ios/iphoneos/
          retention-days: 7

  # ─── 发布到 Releases 页面 ─────────────────────────────
  publish:
    name: 📦 发布到 Release
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: 准备文件
        run: |
          mkdir -p release
          # Linux
          cd shengyin-linux && tar czf ../release/shengyin-linux-x64.tar.gz . && cd ..
          # Windows
          cd shengyin-windows && zip -r ../release/shengyin-windows-x64.zip . && cd ..
          # macOS
          cd shengyin-macos && zip -r ../release/shengyin-macos.zip . && cd ..
          # Android
          cp shengyin-android/app-release.apk release/shengyin-android.apk

      - name: 🔖 打标签发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nightly-$(date +%Y%m%d-%H%M)"
          SHA="${{ github.sha }}"
          
          # 删除旧 nightly release（避免堆积）
          gh release delete nightly --yes 2>/dev/null || true
          gh release create "nightly" \
            --title "📥 最新构建 $(date '+%Y-%m-%d %H:%M')" \
            --notes "自动构建于 commit [$SHA](https://github.com/Chendejun1996/shengyin/commit/$SHA)" \
            release/*.tar.gz release/*.zip release/*.apk
