name: 编译所有平台客户端

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    name: 🐧 Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
        working-directory: client
      - run: flutter build linux --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-linux
          path: client/build/linux/x64/release/bundle/
          retention-days: 7

  windows:
    name: 🪟 Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: flutter create --platforms=windows --project-name shengyin .
        working-directory: client
      - run: flutter pub get
        working-directory: client
      - run: flutter build windows --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-windows
          path: client/build/windows/x64/runner/Release/
          retention-days: 7

  macos:
    name: 🍎 macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: flutter create --platforms=macos --project-name shengyin .
        working-directory: client
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
        working-directory: client
      - run: flutter build macos --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-macos
          path: client/build/macos/Build/Products/Release/
          retention-days: 7

  android:
    name: 📱 Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: flutter pub get
        working-directory: client
      - run: flutter build apk --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-android
          path: client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  ios:
    name: 📱 iOS
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    continue-on-error: true  # iOS 需要 Apple 开发者签名，失败不影响其他平台
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
      - run: flutter create --platforms=ios --project-name shengyin .
        working-directory: client
      - run: flutter pub get
        working-directory: client
      - run: flutter build ios --release --no-codesign
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shengyin-ios
          path: client/build/ios/iphoneos/
          retention-days: 7

  # ─── 发布到 Releases 页面 ─────────────────────────────
  publish:
    name: 📦 发布到 Release
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: 准备文件
        run: |
          mkdir -p release
          # Linux
          cd shengyin-linux && tar czf ../release/shengyin-linux-x64.tar.gz . && cd ..
          # Windows
          cd shengyin-windows && zip -r ../release/shengyin-windows-x64.zip . && cd ..
          # macOS
          cd shengyin-macos && zip -r ../release/shengyin-macos.zip . && cd ..
          # Android
          cp shengyin-android/app-release.apk release/shengyin-android.apk

      - name: 🔖 打标签发布
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -x
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          
          # 判断是正式版本标签还是日常构建
          if [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" == v* ]]; then
            TAG="$REF_NAME"
            TITLE="🎵 笙音 $TAG"
            # 从 CHANGELOG.md 提取对应版本的更新内容
            if [ -f CHANGELOG.md ]; then
              NOTES=$(python3 -c "
import sys, re
tag = '$TAG'
with open('CHANGELOG.md', 'r') as f:
    content = f.read()
pattern = r'## ' + re.escape(tag) + r'\s*\(.*?\)\n(.*?)(?=\n## |\Z)'
match = re.search(pattern, content, re.DOTALL)
if match:
    body = match.group(1).strip()
    # 去掉引用格式
    print(body)
else:
    print('')
")
            else
              NOTES=""
            fi
          else
            TAG="nightly"
            TITLE="🔄 Nightly 构建 $(date '+%Y-%m-%d %H:%M')"
            NOTES="自动构建于 commit [$SHA](${{ github.server_url }}/$REPO/commit/$SHA)"
          fi
          
          ls -la release/
          
          # 尝试删除旧的同名 release（如果存在）
          gh release delete "$TAG" --yes --repo "$REPO" 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TITLE" \
            --notes "$NOTES" \
            release/*.{tar.gz,zip,apk} 2>&1
